<p-table
  #table
  [value]="data"
  [columns]="config.columns"
  [showGridlines]="config.showGridlines"
  [paginator]="config.paginator"
  [rows]="config.rows"
  [rowsPerPageOptions]="config.rowsPerPageOptions"
  [globalFilterFields]="config.globalFilterFields"
  [(selection)]="selection"
  [selectionMode]="config.selectionMode"
  [dataKey]="config.dataKey"
  [scrollable]="config.scrollable"
  [scrollHeight]="config.scrollHeight"
  [virtualScroll]="config.virtualScroll"
  [virtualScrollItemSize]="config.virtualScrollItemSize"
  [frozenValue]="frozenValueData"
  [frozenColumns]="config.frozenColumns"
  [frozenWidth]="config.frozenWidth"
  [resizableColumns]="config.resizableColumns"
  [columnResizeMode]="config.columnResizeMode"
  [reorderableColumns]="config.reorderableColumns"
  [stateKey]="config.stateKey"
  stateStorage="local"
  [loading]="config.loading"
  styleClass="p-datatable-sm"
  [showCurrentPageReport]="config.first"
  [first]="config.first ? first : null"
  (onPage)="config.first ? pageChange($event) : ''"
  [tableStyle]="{'min-width': '50rem'}"
>
  <!-- ================= CAPTION ================= -->
  <ng-template pTemplate="caption">
    <ng-container *ngIf="config.captionTemplate; else defaultCaption">
      <ng-container *ngTemplateOutlet="config.captionTemplate"></ng-container>
    </ng-container>

    <ng-template #defaultCaption>
      <div class="table-caption">
        {{ config.caption }}
      </div>

      <!-- Global Filter -->
      <input
        *ngIf="config.globalFilter"
        pInputText
        type="text"
        placeholder="Global Search"
        (input)="table.filterGlobal($any($event.target).value, 'contains')"
      />
    </ng-template>
  </ng-template>

  <!-- ================= HEADER ================= -->
  <ng-template pTemplate="header" let-columns>
    <tr>
      <!-- Selection column -->
      <th *ngIf="config.selectionMode === 'multiple'">
        <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
      </th>

      <th
        *ngFor="let col of columns"
        [pSortableColumn]="col.sortable ? col.field : null"
        pResizableColumn
        pReorderableColumn
        [style.width]="col.width"
      >
        {{ col.header }}

        <p-sortIcon *ngIf="col.sortable" [field]="col.field"></p-sortIcon>

         <p-columnFilter
          *ngIf="col.filter"
          type="text"
          placeholder="Search"
          [field]="col.field"
        ></p-columnFilter> 
       
        <p-columnFilter  *ngIf="col.advfilter" type="text" field="name" display="menu" />
      </th>
    </tr>
  </ng-template>
<!-- frozen body -->
 <ng-template pTemplate="frozenbody" let-row let-columns="columns">
    <tr class="font-bold">
      <td *ngFor="let col of columns">
        {{ row[col.field] }}
      </td>
    </tr>
  </ng-template>
  <!-- ================= BODY ================= -->
  <ng-template pTemplate="body" let-row let-columns="columns">
    <tr [pSelectableRow]="config.selectionMode === 'single'? row : {}"
      [ngClass]="config.conditionalStyle ? rowClass(row) : {}"
      [ngStyle]="config.conditionalStyle ? rowStyle(row) : {}"
    >
      <!-- Selection cell -->
      <td *ngIf="config.selectionMode === 'multiple'">
        <p-tableCheckbox [value]="row"></p-tableCheckbox>
      </td>

      <td *ngFor="let col of columns">
        <ng-container *ngIf="col.bodyTemplate; else defaultCell">
          <ng-container
            *ngTemplateOutlet="col.bodyTemplate; context: { $implicit: row }"
          ></ng-container>
        </ng-container>

        <ng-template #defaultCell>
          {{ row[col.field] }}
        </ng-template>
      </td>
    </tr>
  </ng-template>

 

</p-table>
<div class="flex justify-center mb-4" *ngIf="config.size">
  <p-selectbutton
    [options]="sizes"
    [(ngModel)]="selectedSize"
    [multiple]="false"
    optionLabel="name"
    optionValue="class"
  />
</div>
